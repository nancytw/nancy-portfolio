<!DOCTYPE html>
<html lang="zh-TW" id="htmlLang">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Risk Check Lab - MailGuardian AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1 data-zh="郵件風險檢查實驗室" data-en="Email Risk Check Lab">郵件風險檢查實驗室</h1>
            <button id="langBtn" class="lang-btn">EN / 中文</button>
        </header>
        
        <main>
            <section class="card">
                <h2 data-zh="系統狀態與測試" data-en="System Status & Testing">系統狀態與測試</h2>
                <p data-zh="點擊下方按鈕測試前端與後端 Azure Logic App 串接狀態。" data-en="Click the button below to test frontend and backend Azure Logic App integration status.">點擊下方按鈕測試前端與後端 Azure Logic App 串接狀態。</p>
                <button id="testBtn" class="action-btn" data-zh="執行測試" data-en="Run Test">執行測試</button>
                <div id="resultText" class="result-box"></div>
            </section>
        </main>

        <footer>
            <p data-zh="&copy; 採用 Cloudflare Pages 託管。專為實驗與開發設計。" data-en="&copy; Built with Cloudflare Pages. Designed for Lab Testing.">&copy; 採用 Cloudflare Pages 託管。專為實驗與開發設計。</p>
            <p class="update-time"><span id="lastUpdated"></span></p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
